name: iPad 120 FPS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - ipad-120fps-test

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Inspect Xcode project and SDKs
        run: |
          xcodebuild -version
          xcodebuild -list -project Moonlight.xcodeproj
          xcodebuild -showsdks

      - name: Download iOS platform
        run: xcodebuild -downloadPlatform iOS

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project Moonlight.xcodeproj \
            -scheme Moonlight \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/MoonlightBuild" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Test latest-frame mailbox and ownership
        run: |
          xcrun --sdk macosx clang \
            -fobjc-arc -fblocks -std=gnu11 -fsanitize=address -g \
            -I moonlight-common/moonlight-common-c/src \
            -framework Foundation -framework AVFoundation -framework VideoToolbox \
            -framework CoreMedia -framework CoreVideo -framework QuartzCore \
            Tests/latest-frame-decoder-tests.m \
            -o "$RUNNER_TEMP/latest-frame-tests"
          "$RUNNER_TEMP/latest-frame-tests"

      - name: Test gamepad queue, edges, and teardown
        run: |
          common=moonlight-common/moonlight-common-c
          xcrun --sdk macosx clang -std=gnu11 -g -O1 \
            -Wall -Wextra -Wno-unused-parameter -Werror -DLC_DEBUG \
            -fsanitize=address,undefined -pthread -I "$common/src" -I "$common/enet/include" \
            "$common/tests/gamepad-input-tests.c" "$common/src/Platform.c" \
            "$common/src/LinkedBlockingQueue.c" -o "$RUNNER_TEMP/gamepad-tests"
          "$RUNNER_TEMP/gamepad-tests"

      - name: Test Low Latency preference migration
        run: |
          xcrun --sdk macosx clang -fobjc-arc -g -fsanitize=address \
            -framework Foundation Tests/low-latency-settings-tests.m \
            -o "$RUNNER_TEMP/low-latency-settings-tests"
          "$RUNNER_TEMP/low-latency-settings-tests"

      - name: Test cancellation during stream startup
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          for source, output in (
              ('Connection.h', 'connection-under-test.inc'),
              ('StreamManager.h', 'stream-manager-header-under-test.inc'),
              ('StreamManager.m', 'stream-manager-under-test.inc'),
          ):
              lines = (Path('Limelight/Stream') / source).read_text().splitlines()
              body = '\n'.join(line for line in lines if not line.lstrip().startswith(('#import ', '#include ')))
              (Path(os.environ['RUNNER_TEMP']) / output).write_text(body + '\n')
          PY
          xcrun --sdk macosx clang -fobjc-arc -fblocks -g -fsanitize=address \
            -I "$RUNNER_TEMP" -framework Foundation \
            Tests/stream-manager-tests.m -o "$RUNNER_TEMP/stream-manager-tests"
          "$RUNNER_TEMP/stream-manager-tests"

      - name: Package unsigned IPA
        run: |
          app="$RUNNER_TEMP/MoonlightBuild/Build/Products/Release-iphoneos/Moonlight.app"
          test -d "$app"
          test -f "$app/Moonlight"
          mkdir -p "$RUNNER_TEMP/MoonlightIPA/Payload"
          ditto "$app" "$RUNNER_TEMP/MoonlightIPA/Payload/Moonlight.app"
          cd "$RUNNER_TEMP/MoonlightIPA"
          zip -qry "$GITHUB_WORKSPACE/Moonlight-iPad-120FPS.ipa" Payload
          unzip -l "$GITHUB_WORKSPACE/Moonlight-iPad-120FPS.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6
        with:
          name: Moonlight-iPad-120FPS
          path: Moonlight-iPad-120FPS.ipa
          if-no-files-found: error
